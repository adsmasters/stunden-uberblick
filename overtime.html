<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Überstunden – Stundencheck</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo">Stunden<span>check</span></a>
    <nav>
      <a href="index.html"       class="nav-link">Übersicht</a>
      <a href="bearbeiter.html"  class="nav-link">Monatsansicht</a>
      <a href="clients.html"     class="nav-link">Kunden</a>
      <a href="employees.html"   class="nav-link">Mitarbeiter</a>
      <a href="utilization.html" class="nav-link">Auslastung</a>
      <a href="overtime.html"    class="nav-link active">Überstunden</a>
      <a href="settings.html"    class="nav-link">Einstellungen</a>
    </nav>
  </div>
</header>

<main class="main">

  <div id="setupHint" class="hidden">
    <div class="state-box">
      <div class="icon">⚙️</div>
      <h3>Einstellungen erforderlich</h3>
      <p>Bitte zuerst die Supabase-Verbindung in den <a href="settings.html">Einstellungen</a> konfigurieren.</p>
      <a href="settings.html" class="btn btn-primary">Zu den Einstellungen</a>
    </div>
  </div>

  <div class="page-header">
    <div>
      <h1>Überstunden &amp; Urlaub</h1>
      <div class="sub">Überstunden und Urlaubsübersicht pro Mitarbeiter</div>
    </div>
    <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
      <div class="field" style="margin:0">
        <label for="empSelect" style="font-size:12px;margin-bottom:4px;display:block;color:var(--text-secondary)">Mitarbeiter</label>
        <select id="empSelect" style="height:36px;padding:0 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;background:#fff;min-width:180px">
          <option value="">— Bitte wählen —</option>
        </select>
      </div>
      <div class="field" style="margin:0">
        <label for="yearSelect" style="font-size:12px;margin-bottom:4px;display:block;color:var(--text-secondary)">Jahr</label>
        <select id="yearSelect" style="height:36px;padding:0 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;background:#fff;width:90px"></select>
      </div>
      <button id="loadBtn" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Laden
      </button>
    </div>
  </div>

  <div id="error"></div>
  <div id="loading"></div>
  <div id="summary" class="hidden" style="margin-bottom:20px"></div>
  <div id="content"></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/db.js"></script>
<script src="js/appsettings.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/overtime.js?v=5"></script>
<script defer src="https://adsmasters.github.io/hub/backlink.js"></script>
</body>
</html>
